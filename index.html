<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Impi party</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#FFF8E7;
    --card:#ffffff;
    --card-2:#FFF2CF;
    --ink:#171717;
    --stroke:#171717;
    --text:#171717;
    --text-dim:#5b5b5b;
    --accent:#F5C518;
    --accent-ink:#171717;
    --pink:#F0439D;
    --purple:#7B5FE0;
    --lime:#8BC63E;
    --blue:#4FB6E8;
    --red:#F0473A;
    --gold:#8a6400;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:calc(26px + env(safe-area-inset-top, 0px)) 18px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  h1,h2{font-family:'Poppins',sans-serif; margin:0;}
  .eyebrow{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:2.5px;
    color:var(--text-dim);
    text-align:center;
    margin-bottom:6px;
    font-weight:700;
  }
  .title{
    font-weight:900;
    font-size:32px;
    text-align:center;
    margin-bottom:4px;
    letter-spacing:-0.5px;
  }
  .title .hl{color:var(--pink);}
  .sub{
    text-align:center;
    font-size:13.5px;
    color:var(--text-dim);
    margin-bottom:24px;
    line-height:1.5;
    font-weight:500;
  }
  .card{
    background:var(--card);
    border:2.5px solid var(--ink);
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:5px 5px 0 var(--ink);
  }
  .field-label{
    display:block;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1.3px;
    color:var(--text-dim);
    margin-bottom:10px;
    font-weight:800;
  }
  .stepper{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card-2);
    border:2px solid var(--ink);
    border-radius:14px;
    padding:6px;
  }
  .stepper button{
    width:44px;height:44px;border-radius:10px;border:2px solid var(--ink);
    background:#fff; color:var(--text);
    font-size:20px; font-weight:800; cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
  }
  .stepper button:active{background:var(--accent); transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .stepper .val{font-size:22px;font-weight:800;font-family:'Poppins',sans-serif;}
  .mode-card{
    background:var(--card);
    border:2.5px solid var(--ink);
    border-radius:20px;
    padding:22px 18px;
    margin-bottom:16px;
    display:flex; align-items:center; gap:16px;
    cursor:pointer;
    box-shadow:6px 6px 0 var(--ink);
    transition:transform .08s, box-shadow .08s;
  }
  .mode-card:active{transform:translate(4px,4px); box-shadow:2px 2px 0 var(--ink);}
  .mode-card .txt h2{font-size:19px; margin-bottom:4px; font-weight:800;}
  .mode-card .txt p{margin:0; font-size:13px; color:var(--text-dim); line-height:1.4;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:flex; align-items:center; gap:6px;
    padding:9px 14px; border-radius:999px;
    background:#fff; border:2px solid var(--ink);
    color:var(--text); font-size:13px; font-weight:700; cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);
  }
  .chip.active{background:var(--accent); color:var(--ink); border-color:var(--ink);}
  .name-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .name-row input{
    flex:1;
    background:#fff; border:2px solid var(--ink); border-radius:10px;
    color:var(--text); padding:11px 12px; font-size:14px; font-family:'Inter',sans-serif;
    font-weight:600;
  }
  .name-row input:focus{outline:2px solid var(--pink); outline-offset:1px;}
  .btn{
    display:block; width:100%; padding:16px; border-radius:14px; border:2.5px solid var(--ink);
    font-size:15.5px; font-weight:800; cursor:pointer; font-family:'Poppins',sans-serif;
    transition:transform .08s, box-shadow .08s;
  }
  .btn-primary{background:var(--accent); color:var(--ink); box-shadow:5px 5px 0 var(--ink);}
  .btn-primary:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink);}
  .btn-lime{background:var(--lime); color:var(--ink); box-shadow:5px 5px 0 var(--ink);}
  .btn-lime:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--ink);}
  .btn-ghost{background:#fff; color:var(--text); border:2.5px solid var(--ink); box-shadow:none; margin-top:10px;}
  .btn-ghost:active{background:var(--card-2);}
  .spacer{flex:1;}
  .center-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;}
  .progress-tag{font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); font-weight:800;}
  .pass-name{font-size:26px; font-weight:800; font-family:'Poppins',sans-serif;}

  .flip-wrap{width:230px;height:290px;perspective:1300px;cursor:pointer;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;}
  .flip-wrap.flipped .flip-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;}
  .face-back{background:var(--purple); border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink);}
  .face-back span{font-size:13px;color:#fff;font-weight:800;letter-spacing:1px;}
  .face-front{background:#fff; border:3px solid var(--ink); transform:rotateY(180deg); box-shadow:6px 6px 0 var(--ink);}
  .face-front .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;font-weight:800;}
  .face-front .word{font-family:'Poppins',sans-serif;font-weight:900;font-size:24px;text-transform:uppercase;}
  .face-front.imp .word{color:var(--red);}
  .face-front .hint{margin-top:12px;font-size:12.5px;color:var(--text-dim);line-height:1.4;}

  .grid-players{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
  .player-btn{
    background:var(--card); border:2.5px solid var(--ink); border-radius:16px;
    padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer; font-size:13px; font-weight:700;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s, box-shadow .08s;
  }
  .player-btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink);}
  .player-row{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:2.5px solid var(--ink); border-radius:14px;
    padding:10px 14px; margin-bottom:10px;
    box-shadow:4px 4px 0 var(--ink);
  }
  .player-row.out{opacity:0.45;}
  .player-row .name{flex:1; font-weight:700; font-size:14.5px;}
  .lives-row{display:flex; gap:3px;}
  .out-tag{font-size:10.5px; color:var(--red); font-weight:800; letter-spacing:1px; text-transform:uppercase;}
  .avatar-badge{
    width:44px; height:44px; border-radius:12px; border:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:2px 2px 0 var(--ink);
  }

  .stamp{
    font-size:14px; letter-spacing:2px; text-transform:uppercase; font-weight:800;
    border:3px solid var(--ink); border-radius:8px; padding:8px 16px; transform:rotate(-3deg);
    background:#fff; box-shadow:4px 4px 0 var(--ink);
  }
  .stamp.safe{color:#3f7a1e; background:var(--lime);}
  .stamp.caught{color:#fff; background:var(--red);}

  input[type=text].guess{
    width:100%; background:#fff; border:2.5px solid var(--ink); border-radius:12px;
    color:var(--text); padding:14px; font-size:15px; text-align:center; font-family:'Inter',sans-serif;
    margin-bottom:14px; font-weight:600;
  }
  .footer-note{text-align:center;font-size:11.5px;color:var(--text-dim);margin-top:14px;font-weight:600;}
  .winner-balloon{margin:6px 0;}
  .badge-round{
    align-self:center; background:var(--accent); border:2px solid var(--ink);
    border-radius:999px; padding:5px 14px; font-size:11.5px; color:var(--ink); margin-bottom:10px; font-weight:800;
    box-shadow:2px 2px 0 var(--ink);
  }
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;
    background:#fff; border:2.5px solid var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;cursor:pointer;color:var(--text);
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .08s, box-shadow .08s;
  }
  .icon-btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink);}
  .icon-btn.danger{color:#fff;background:var(--red);}
  .icon-btn-spacer{width:38px;height:38px;}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(23,23,23,0.55);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .modal-card{
    background:var(--card); border:3px solid var(--ink); border-radius:18px;
    padding:22px; max-width:340px; width:100%; text-align:center;
    box-shadow:7px 7px 0 var(--ink);
  }
  .modal-card h2{font-size:18px; margin-bottom:8px; font-weight:800;}
  .modal-card p{font-size:13.5px; color:var(--text-dim); margin:0 0 18px; line-height:1.4;}
  .modal-actions{display:flex; flex-direction:column; gap:10px;}
</style>
</head>

function t(key, vars){
  let s = (I18N[lang] && I18N[lang][key]) || I18N.pt[key] || key;
  if(vars){ for(const k in vars){ s = s.split('{'+k+'}').join(vars[k]); } }

}

/* ---------- audio (synthesized, no files) ---------- */
let audioCtx = null, masterSfx = null, masterMusic = null, noiseBuf = null;
let sfxOn = true, musicOn = true;
try{
  if(localStorage.getItem('impi_sfx') === '0') sfxOn = false;
  if(localStorage.getItem('impi_music') === '0') musicOn = false;
}catch(e){}
function saveAudioPrefs(){
  try{ localStorage.setItem('impi_sfx', sfxOn ? '1' : '0'); localStorage.setItem('impi_music', musicOn ? '1' : '0'); }catch(e){}
}
function ensureAudio(){
  if(audioCtx){
    if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
    return audioCtx;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null;
  try{
    audioCtx = new AC();
    masterSfx = audioCtx.createGain(); masterSfx.gain.value = 0.8; masterSfx.connect(audioCtx.destination);
    masterMusic = audioCtx.createGain(); masterMusic.gain.value = 0.5; masterMusic.connect(audioCtx.destination);
    const len = Math.floor(audioCtx.sampleRate * 0.25);
    noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // iOS unlock: play a tiny silent buffer inside the user gesture
    const b = audioCtx.createBuffer(1, 1, 22050);
    const src = audioCtx.createBufferSource(); src.buffer = b; src.connect(audioCtx.destination); src.start(0);
    if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
  }catch(e){ audioCtx = null; }
  return audioCtx;
}
function tone(freq, start, dur, type, vol, dest, slideTo){
  const c = audioCtx;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, start);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, start + dur);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.linearRampToValueAtTime(vol, start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g); g.connect(dest);
  o.start(start); o.stop(start + dur + 0.05);
}
function noiseHit(start, dur, vol, dest, hp){
  const c = audioCtx;
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 6000;
  const g = c.createGain();
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  s.connect(f); f.connect(g); g.connect(dest);
  s.start(start); s.stop(start + dur + 0.02);
}
/* efeitos sonoros: estilo desenho animado (boings, apito deslizando, trombone) */
const SFX = {
  tap:    t => tone(500, t, 0.08, 'sine', 0.25, masterSfx, 900),
  flip:   t => { tone(300, t, 0.18, 'sine', 0.3, masterSfx, 900); noiseHit(t, 0.1, 0.25, masterSfx, 3000); },
  vote:   t => { tone(700, t, 0.1, 'sine', 0.3, masterSfx, 350); tone(500, t + 0.1, 0.12, 'sine', 0.3, masterSfx, 900); },
  start:  t => { tone(200, t, 0.35, 'triangle', 0.3, masterSfx, 800); tone(400, t + 0.18, 0.3, 'triangle', 0.3, masterSfx, 1200); },
  tie:    t => { tone(500, t, 0.2, 'triangle', 0.3, masterSfx, 300); tone(500, t + 0.25, 0.2, 'triangle', 0.3, masterSfx, 300); },
  caught: t => { tone(400, t, 0.4, 'sine', 0.3, masterSfx, 1600); tone(1200, t + 0.42, 0.1, 'triangle', 0.3, masterSfx); tone(1600, t + 0.5, 0.25, 'triangle', 0.3, masterSfx); },
  escaped:t => { tone(1200, t, 0.6, 'sine', 0.3, masterSfx, 200); tone(150, t + 0.62, 0.2, 'triangle', 0.3, masterSfx, 300); },
  good:   t => { tone(600, t, 0.08, 'triangle', 0.3, masterSfx, 1200); tone(900, t + 0.09, 0.2, 'triangle', 0.3, masterSfx, 1800); },
  bad:    t => { tone(233, t, 0.3, 'sawtooth', 0.18, masterSfx, 220); tone(220, t + 0.32, 0.3, 'sawtooth', 0.18, masterSfx, 208); tone(196, t + 0.64, 0.6, 'sawtooth', 0.18, masterSfx, 150); },
  round:  t => { tone(500, t, 0.1, 'triangle', 0.3, masterSfx, 800); tone(800, t + 0.12, 0.2, 'triangle', 0.3, masterSfx, 1000); },
  win:    t => { [0, 1, 2, 3].forEach(i => tone(300 + i * 150, t + i * 0.14, 0.25, 'triangle', 0.3, masterSfx, 700 + i * 200)); noiseHit(t + 0.6, 0.3, 0.3, masterSfx, 4000); }
};
function sfx(name){
  if(!sfxOn) return;
  const c = ensureAudio();
  if(!c || !SFX[name]) return;
  try{ SFX[name](c.currentTime + 0.01); }catch(e){}
}

const MUSIC = {bpm:112, step:0, next:0, timer:null};
const CHORDS = [
  {bass:130.81, fifth:196.00, arp:[261.63, 329.63, 392.00]},
  {bass:110.00, fifth:164.81, arp:[220.00, 261.63, 329.63]},
  {bass:174.61, fifth:261.63, arp:[349.23, 440.00, 523.25]},
  {bass:196.00, fifth:293.66, arp:[392.00, 493.88, 587.33]}
];
const _ = null;
const MELODY = [
  [659.25,_,_,783.99,_,659.25,_,587.33, 523.25,_,_,_,587.33,_,659.25,_],
  [523.25,_,659.25,_,880.00,_,783.99,_, 659.25,_,_,_,523.25,_,_,_],
  [880.00,_,_,783.99,_,659.25,_,523.25, 587.33,_,659.25,_,783.99,_,_,_],
  [783.99,_,_,659.25,_,587.33,_,659.25, 783.99,_,_,_,587.33,_,523.25,_]
];
function musicSchedule(){
  const c = audioCtx;
  if(!c || !musicOn) return;
  const stepDur = 60 / MUSIC.bpm / 4;
  while(MUSIC.next < c.currentTime + 0.3){
    const s = MUSIC.step % 64, bar = Math.floor(s / 16), i = s % 16, t = MUSIC.next;
    const ch = CHORDS[bar];
    if(i === 0) tone(ch.bass, t, stepDur * 7, 'triangle', 0.5, masterMusic);
    if(i === 8) tone(ch.bass, t, stepDur * 3, 'triangle', 0.45, masterMusic);
    if(i === 12) tone(ch.fifth, t, stepDur * 3, 'triangle', 0.35, masterMusic);
    if(i % 2 === 0) tone(ch.arp[(i / 2) % 3], t, stepDur * 1.6, 'triangle', 0.09, masterMusic);
    const m = MELODY[bar][i];
    if(m) tone(m, t, stepDur * 2.2, 'square', 0.13, masterMusic);
    if(i === 0 || i === 8) tone(150, t, 0.12, 'sine', 0.6, masterMusic, 45);
    if(i % 4 === 2) noiseHit(t, 0.05, 0.08, masterMusic, 7000);
    MUSIC.next += stepDur; MUSIC.step++;
  }
}
function musicStart(){
  if(!musicOn) return;
  const c = ensureAudio();
  if(!c || MUSIC.timer) return;
  try{ masterMusic.gain.cancelScheduledValues(c.currentTime); masterMusic.gain.setValueAtTime(0.5, c.currentTime); }catch(e){}
  MUSIC.next = c.currentTime + 0.1; MUSIC.step = 0;
  musicSchedule();
  MUSIC.timer = setInterval(musicSchedule, 100);
}
function musicStop(){
  if(MUSIC.timer){ clearInterval(MUSIC.timer); MUSIC.timer = null; }
  if(audioCtx && masterMusic){ try{ masterMusic.gain.setTargetAtTime(0, audioCtx.currentTime, 0.08); }catch(e){} }
}
/* first user gesture unlocks audio and starts the music; every tap on a control gets a soft blip */
document.addEventListener('click', e => {
  ensureAudio();
  if(musicOn) musicStart();
  if(e.target && e.target.closest && e.target.closest('.btn, .chip, .icon-btn, .mode-card, .player-btn, .stepper button, .flip-wrap')) sfx('tap');
}, true);
document.addEventListener('visibilitychange', () => {
  if(!audioCtx) return;
  try{ if(document.hidden) audioCtx.suspend(); else audioCtx.resume(); }catch(e){}
});
let lastSfxKey = '';
function autoSfx(){
  let key = null, name = null;
  const s = state.screen;
  if(s === 'reveal' && state.flipped){ key = 'flip-' + state.round + '-' + state.revealIndex; name = 'flip'; }
  else if(s === 'tieNotice'){ key = 'tie-' + state.round + '-' + JSON.stringify(state.voting.candidatePool); name = 'tie'; }
  else if(s === 'result' && state.resultRevealed){ key = 'res-' + state.round + '-' + state.accusedId; name = state.accusedWasImpostor ? 'caught' : 'escaped'; }
  else if(s === 'discovery' && state.discoveryFeedback !== null){ key = 'disc-' + state.round + '-' + state.discoveryIndex; name = state.discoveryFeedback ? 'good' : 'bad'; }
  else if(s === 'roundSummary'){ key = 'sum-' + state.round; name = 'round'; }
  else if(s === 'gameOver'){ key = 'over-' + state.round; name = 'win'; }
  if(name && key !== lastSfxKey){ lastSfxKey = key; sfx(name); }
}

/* ---------- helpers ---------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function normalize(str){
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').trim();
}
function activePlayers(){ return state.players.filter(p=>p.lives>0); }
function maxLives(){ return state.division === 'perguntas' ? 7 : 5; }
function newVoteOrder(active){
  let order = shuffle(active).map(p=>p.id);
  if(order.length > 1 && order[0] === state.lastVoteStarterId){
    const swapWith = 1 + Math.floor(Math.random()*(order.length-1));
    [order[0], order[swapWith]] = [order[swapWith], order[0]];
  }
  state.lastVoteStarterId = order[0];
  return order;
}

function ensureNames(){

  while(arr.length < state.playerCount) arr.push('');
  state.names = arr;
}

/* ---------- word picking ---------- */
function poolEntries(){
  let list = [];
  state.themes.forEach(k => THEMES[k].words.forEach(w => list.push({word:w, themeKey:k})));
  return list;
}
function numberRangeHint(n){
  const width = 14 + Math.floor(Math.random()*10);
  const offset = Math.floor(Math.random()*width*0.6) - Math.floor(width*0.3);
  let lo = n - Math.floor(width/2) + offset;
  let hi = lo + width;
  if(lo < 1){ hi += (1-lo); lo = 1; }
  if(hi > 100){ lo -= (hi-100); hi = 100; }
  lo = Math.max(1, lo);
  return `Entre ${lo} e ${hi}`;
}
function pickWordEntry(exclude){
  let p = poolEntries().filter(e => e.word !== exclude && !state.usedWords.has(e.word));
  if(p.length === 0){
    state.usedWords.clear();
    p = poolEntries().filter(e => e.word !== exclude);
  }
  return p[Math.floor(Math.random()*p.length)];
}

function pickQuestionPair(){
  let p = QUESTION_PAIRS.filter(q => !state.usedQuestions.has(q.main));
  if(p.length === 0){
    state.usedQuestions.clear();
    p = QUESTION_PAIRS;
  }
  return p[Math.floor(Math.random()*p.length)];
}

/* ---------- round setup ---------- */
function startRound(){
  const active = activePlayers();
  state.round++;
  if(state.division === 'perguntas'){
    const pair = pickQuestionPair();
    const swap = Math.random() < 0.5;
    state.word = swap ? pair.imp : pair.main;
    state.altWord = swap ? pair.main : pair.imp;
    state.wordTheme = null;
    state.wordHint = null;
    state.usedQuestions.add(pair.main);
  } else {
    const mainEntry = pickWordEntry(null);
    state.word = mainEntry.word;
    state.wordTheme = mainEntry.themeKey;
    state.wordHint = mainEntry.themeKey === 'numeros'
      ? null
      : (HINTS[mainEntry.word] || `Tema: ${THEMES[mainEntry.themeKey].label}`);
    const altEntry = pickWordEntry(state.word);
    state.altWord = altEntry.word;
    state.usedWords.add(mainEntry.word);
    state.usedWords.add(altEntry.word);
  }
  const impCount = Math.min(state.impostorCount, Math.max(1, active.length - 1));
  const shuffled = shuffle(active);
  state.impostorIds = shuffled.slice(0, impCount).map(p=>p.id);
  state.revealOrder = shuffled.concat(shuffled.slice(impCount)).slice(0,0); // unused
  state.revealOrderIds = shuffle(active).map(p=>p.id);
  state.revealIndex = 0;
  state.flipped = false;
  state.accusedId = null;
  state.accusedWasImpostor = null;
  state.resultRevealed = false;
  state.discoveryQueue = [];
  state.discoveryIndex = 0;
  state.discoveryFeedback = null;
  state.questionRevealed = false;
  state.screen = 'reveal';
}

function startGame(){
  ensureNames();
  state.usedWords = new Set();
  state.lastVoteStarterId = null;
  state.players = state.names.map((n,i)=>({
    id: i,
    name: n.trim() || t('playerN', {n: i+1}),
    color: FRUITS[i % 9],
    lives: maxLives()
  }));
  startRound();
  render();
}

const GAME_SCREENS = new Set(['reveal','preVote','discuss','voting','tieNotice','result','discovery','roundSummary']);
const NAV_SCREENS = new Set(['mode','setup','settings','reveal','preVote','discuss','voting','tieNotice','result','discovery','roundSummary','gameOver']);

function renderTopbar(showDesistir){
  return `
    <div class="topbar">
      <div class="icon-btn" id="home-btn" title="${t('menuTip')}">🏠</div>
      ${showDesistir ? `<div class="icon-btn danger" id="desistir-btn" title="${t('giveUpTip')}">✕</div>` : `<div class="icon-btn-spacer"></div>`}
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  const map = {
    studio: renderStudio, splash: renderSplash, menu: renderMenu, settings: renderSettings,
    mode: renderMode, setup: renderSetup, reveal: renderReveal,
    preVote: renderPreVote, discuss: renderDiscuss, voting: renderVoting,
    tieNotice: renderTieNotice, result: renderResult, discovery: renderDiscovery,
    roundSummary: renderRoundSummary, gameOver: renderGameOver
  };
  const content = map[state.screen]();
  const modal = state.confirmDesistir ? `
    <div class="modal-overlay" id="desistir-overlay">
      <div class="modal-card">
        <h2>${t('giveUpTitle')}</h2>
        <p>${t('giveUpText')}</p>
        <div class="modal-actions">
          <button class="btn btn-primary" id="confirm-desistir-btn" style="background:var(--red); color:#fff;">${t('yesGiveUp')}</button>
          <button class="btn btn-ghost" id="cancel-desistir-btn" style="margin-top:0;">${t('cancel')}</button>
        </div>
      </div>
    </div>
  ` : '';
  app.innerHTML = (NAV_SCREENS.has(state.screen)
    ? renderTopbar(GAME_SCREENS.has(state.screen)) + content
    : content) + modal;
  attach();
  autoSfx();
  if(state.screen === 'studio' && !state.studioScheduled){
    state.studioScheduled = true;
    setTimeout(() => {
      if(state.screen === 'studio'){ state.screen = 'splash'; render(); }
    }, 2500);
  }
  if(state.screen === 'splash' && !state.splashScheduled){
    state.splashScheduled = true;
    setTimeout(() => {
      if(state.screen === 'splash'){ state.screen = 'menu'; render(); }
    }, 1800);
  }
}

  const p = state.players.find(pl=>pl.id===id);

  const isImp = state.impostorIds.includes(id);
  const isQuestions = state.division === 'perguntas';
  let word, kicker, hint, cls, wordStyle='';
  if(isQuestions){
    wordStyle = 'text-transform:none; font-size:16px; line-height:1.3;';
    word = qL(isImp ? state.altWord : state.word);
    kicker = t('yourQuestionIs');
    hint = t('answerAloud');
    cls = '';
  } else if(isImp){
    word = t('youAreImpostor');
    kicker = t('attention');
    const h = currentHint();
    hint = h ? t('hintLine',{hint:h}) : t('noHintLine');
    cls = 'imp';

  const choices = pool.filter(p=>p.id !== voter.id);
  const btns = choices.map((p,i)=>`
    <div class="player-btn" data-vote-target="${p.id}">
      ${fruitSVG(p.color.type, p.color.hex, 44, true)}

}

        <div>${fruitSVG(accused.color.type, accused.color.hex, 70, true)}</div>
        <h1 style="font-size:24px;">${t('mostVoted',{name:accused.name})}</h1>
        <button class="btn btn-primary" id="reveal-result-btn">${t('reveal')}</button>
      </div>
    `;
  }
  const caught = state.accusedWasImpostor;
  return `
    <div class="center-col">
      <div class="stamp ${caught ? 'caught' : 'safe'}">${caught ? t('wasImpostor') : t('notImpostor')}</div>
      <div>${fruitSVG(accused.color.type, accused.color.hex, 70, true)}</div>
      <div class="sub" style="margin-bottom:0;">
        ${caught ? t('losesLife',{name:accused.name}) : t('innocentsLose')}
      </div>
      <button class="btn btn-primary" id="after-result-btn">${t('continue')}</button>
    </div>
  `;
}

function renderDiscovery(){
  const id = state.discoveryQueue[state.discoveryIndex];
  const p = state.players.find(pl=>pl.id===id);
  const isQuestions = state.division === 'perguntas';
  if(state.discoveryFeedback !== null){
    const ok = state.discoveryFeedback;
    return `
      <div class="center-col">
        <div>${fruitSVG(p.color.type, p.color.hex, 60, true)}</div>
        <div class="stamp ${ok?'safe':'caught'}">${ok ? t('guessedRight') : t('guessedWrong')}</div>
        <div class="sub" style="margin-bottom:0;">${isQuestions ? t('questionWas') : t('wordWas')} <b style="color:var(--gold)">${contentL(state.word)}</b></div>
        <button class="btn btn-primary" id="discovery-next-btn">${t('continue')}</button>
      </div>
    `;
  }
  return `
    <div class="center-col">
      <div class="eyebrow">${t('discovery')}</div>
      <div>${fruitSVG(p.color.type, p.color.hex, 60, true)}</div>
      <h1 style="font-size:22px;">${t(isQuestions ? 'escapedGuessQ' : 'escapedGuessW',{name:p.name})}</h1>
      <input type="text" class="guess" id="guess-input" placeholder="${isQuestions ? t('typeQuestion') : t('typeWord')}">
      <button class="btn btn-primary" id="guess-submit-btn">${t('confirmGuess')}</button>
    </div>
  `;
}

function renderRoundSummary(){
  const rows = state.players.map((p,i)=>{
    const lives = Array.from({length:maxLives()},(_,k)=> heartIcon(k < p.lives, 16));
    return `
      <div class="player-row ${p.lives<=0?'out':''}">
        ${fruitSVG(p.color.type, p.color.hex, 32, true)}
        <div class="name">${p.name}${p.lives<=0?' <span class="out-tag">'+t('eliminated')+'</span>':''}</div>
        <div class="lives-row">${lives.join('')}</div>
      </div>
    `;
  }).join('');
  return `
    <div class="eyebrow">${t('roundEnd',{r:state.round})}</div>
    <div class="title" style="font-size:24px; margin-bottom:16px;">${t('livesLeft')}</div>
    <div class="card">${rows}</div>
    <div class="spacer"></div>
    <button class="btn btn-primary" id="next-round-btn">${t('nextRound')}</button>
  `;
}

function renderGameOver(){
  const winner = state.players.find(p=>p.lives>0);
  return `
    <div class="center-col">
      <div class="stamp safe">${t('gameOver')}</div>
      <div class="winner-balloon">${fruitSVG(winner.color.type, winner.color.hex, 90, true)}</div>
      <h1 style="font-size:26px;">${t('wins',{name:winner.name})}</h1>
      <div class="sub" style="margin-bottom:0;">${t('survived',{color:fruitName(winner.color)})}</div>
      <button class="btn btn-primary" id="replay-same-btn">${t('playAgain')}</button>
      <button class="btn btn-ghost" id="replay-new-btn">${t('newGame')}</button>
    </div>
  `;
}

/* ---------- events ---------- */
function attach(){
  const app = document.getElementById('app');

  const homeBtn = document.getElementById('home-btn');
  if(homeBtn) homeBtn.onclick = () => { state.screen='menu'; render(); };

  const desistirBtn = document.getElementById('desistir-btn');
  if(desistirBtn) desistirBtn.onclick = () => { state.confirmDesistir = true; render(); };

  const confirmDesistirBtn = document.getElementById('confirm-desistir-btn');
  if(confirmDesistirBtn) confirmDesistirBtn.onclick = () => {
    state.confirmDesistir = false; state.screen='menu'; render();
  };

  const cancelDesistirBtn = document.getElementById('cancel-desistir-btn');
  if(cancelDesistirBtn) cancelDesistirBtn.onclick = () => {
    state.confirmDesistir = false; render();
  };

  const splashTap = document.getElementById('splash-tap');
  if(splashTap) splashTap.onclick = () => { state.screen='menu'; render(); };

  const studioTap = document.getElementById('studio-tap');
  if(studioTap) studioTap.onclick = () => { state.screen='splash'; render(); };

  const menuSettings = document.getElementById('menu-settings-btn');
  if(menuSettings) menuSettings.onclick = () => { state.screen='settings'; render(); };

  app.querySelectorAll('[data-lang]').forEach(el=>{
    el.onclick = () => { setLang(el.dataset.lang); render(); };
  });

  app.querySelectorAll('[data-audio]').forEach(el=>{
    el.onclick = () => {
      const on = el.dataset.val === '1';
      if(el.dataset.audio === 'sfx') sfxOn = on; else musicOn = on;
      saveAudioPrefs();
      ensureAudio();
      if(musicOn) musicStart(); else musicStop();
      render();
    };
  });

  const settingsBack = document.getElementById('settings-back-btn');
  if(settingsBack) settingsBack.onclick = () => { state.screen='menu'; render(); };

  const menuIniciar = document.getElementById('menu-iniciar-btn');
  if(menuIniciar) menuIniciar.onclick = () => { state.mode='impostor'; state.screen='mode'; render(); };

  app.querySelectorAll('[data-division]').forEach(el=>{
    el.onclick = () => { state.division = el.dataset.division; state.screen='setup'; render(); };
  });

  const backModeBtn = document.getElementById('back-mode-btn');
  if(backModeBtn) backModeBtn.onclick = () => { state.screen='menu'; render(); };

  app.querySelectorAll('[data-act]').forEach(btn=>{
    btn.onclick = () => {
      const act = btn.dataset.act;
      if(act==='p+' && state.playerCount<9) state.playerCount++;
      if(act==='p-' && state.playerCount>3) state.playerCount--;
      const maxImp = Math.min(4, state.playerCount-1);
      if(act==='i+' && state.impostorCount<maxImp) state.impostorCount++;
      if(act==='i-' && state.impostorCount>1) state.impostorCount--;
      ensureNames();
      render();
    };
  });

  app.querySelectorAll('[data-theme]').forEach(chip=>{
    chip.onclick = () => {
      const k = chip.dataset.theme;
      if(state.themes.includes(k)){
        state.themes = state.themes.filter(t=>t!==k);
      } else {
        state.themes.push(k);
      }
      render();
    };
  });

  const allChip = document.querySelector('[data-theme-all]');
  if(allChip) allChip.onclick = () => {
    const allOn = state.themes.length === Object.keys(THEMES).length;
    state.themes = allOn ? [] : Object.keys(THEMES);
    render();
  };

  app.querySelectorAll('[data-name-idx]').forEach(inp=>{
    inp.oninput = (e) => { state.names[parseInt(inp.dataset.nameIdx)] = e.target.value; };
  });

  const startBtn = document.getElementById('start-btn');
  if(startBtn) startBtn.onclick = () => { if(state.division === 'perguntas' || state.themes.length>0){ sfx('start'); startGame(); } };

  const flip = document.getElementById('flip-card');
  if(flip) flip.onclick = () => { state.flipped = true; render(); };

  const nextReveal = document.getElementById('next-reveal-btn');
  if(nextReveal) nextReveal.onclick = () => {
    if(state.revealIndex+1 < state.revealOrderIds.length){
      state.revealIndex++; state.flipped=false; render();
    } else {
      state.screen='preVote'; render();
    }
  };

  const revelarPergunta = document.getElementById('revelar-pergunta-btn');
  if(revelarPergunta) revelarPergunta.onclick = () => { state.questionRevealed = true; render(); };

  const pularRodada = document.getElementById('pular-rodada-btn');
  if(pularRodada) pularRodada.onclick = () => {
    state.round--;
    startRound(); render();
  };

  const iniciarJogo = document.getElementById('iniciar-jogo-btn');
  if(iniciarJogo) iniciarJogo.onclick = () => {
    const active = activePlayers();
    state.starterId = active[Math.floor(Math.random()*active.length)].id;
    state.screen='discuss'; render();
  };

  const iniciarVotacao = document.getElementById('iniciar-votacao-btn');
  if(iniciarVotacao) iniciarVotacao.onclick = () => {
    const active = activePlayers();
    state.voting = { order: newVoteOrder(active), index:0, votes:{}, candidatePool:null, isRevote:false };
    state.screen='voting'; render();
  };

  app.querySelectorAll('[data-vote-target]').forEach(btn=>{
    btn.onclick = () => {
      const v = state.voting;
      const voterId = v.order[v.index];
      v.votes[voterId] = parseInt(btn.dataset.voteTarget);
      sfx('vote');
      v.index++;
      if(v.index < v.order.length){ render(); return; }
      tallyVotes();
    };
  });

  const continueTie = document.getElementById('continue-tie-btn');
  if(continueTie) continueTie.onclick = () => {
    const tied = state.voting.candidatePool;
    const active = activePlayers();
    state.voting = { order: shuffle(active).map(p=>p.id), index:0, votes:{}, candidatePool: tied, isRevote:true };
    state.screen='voting'; render();
  };

  const revealResult = document.getElementById('reveal-result-btn');
  if(revealResult) revealResult.onclick = () => {
    state.accusedWasImpostor = state.impostorIds.includes(state.accusedId);
    applyOutcome();
    state.resultRevealed = true;
    render();
  };

  const afterResult = document.getElementById('after-result-btn');
  if(afterResult) afterResult.onclick = () => {
    if(state.discoveryQueue.length > 0){ state.screen='discovery'; }
    else { state.screen='roundSummary'; }
    render();
  };

  const guessSubmit = document.getElementById('guess-submit-btn');
  if(guessSubmit) guessSubmit.onclick = () => {
    const val = document.getElementById('guess-input').value;
    const correct = val.trim().length>0 && [state.word, contentL(state.word)].some(x => normalize(val) === normalize(x));
    const id = state.discoveryQueue[state.discoveryIndex];
    const p = state.players.find(pl=>pl.id===id);
    if(correct) p.lives = Math.min(maxLives(), p.lives+1);
    state.discoveryFeedback = correct;
    render();
  };

  const discoveryNext = document.getElementById('discovery-next-btn');
  if(discoveryNext) discoveryNext.onclick = () => {
    state.discoveryIndex++;
    state.discoveryFeedback = null;
    if(state.discoveryIndex >= state.discoveryQueue.length){
      state.screen='roundSummary';
    }
    render();
  };

  const nextRound = document.getElementById('next-round-btn');
  if(nextRound) nextRound.onclick = () => {
    const survivors = state.players.filter(p=>p.lives>0);
    if(survivors.length <= 1){ state.screen='gameOver'; render(); return; }
    startRound(); render();
  };

  const replaySame = document.getElementById('replay-same-btn');
  if(replaySame) replaySame.onclick = () => {
    state.players.forEach(p=>p.lives=maxLives());
    state.round = 0;
    state.usedWords = new Set();
    state.lastVoteStarterId = null;
    startRound(); render();
  };

  const replayNew = document.getElementById('replay-new-btn');
  if(replayNew) replayNew.onclick = () => {
    state.mode='impostor'; state.screen='mode'; render();
  };
}

function tallyVotes(){
  const v = state.voting;
  const counts = {};
  Object.values(v.votes).forEach(t => counts[t] = (counts[t]||0)+1);
  let max = 0;
  Object.values(counts).forEach(c => { if(c>max) max=c; });
  const top = Object.keys(counts).filter(id => counts[id]===max).map(id=>parseInt(id));
  if(top.length > 1 && !state.voting.isRevote){
    state.voting.candidatePool = top;
    state.screen = 'tieNotice';
  } else if(top.length > 1){
    // empatou de novo mesmo na revotação (ex.: só 2 jogadores ativos) — sorteia entre os empatados pra não travar
    state.accusedId = top[Math.floor(Math.random()*top.length)];
    state.tieBrokenRandomly = true;
    state.resultRevealed = false;
    state.screen = 'result';
  } else {
    state.accusedId = top[0];
    state.tieBrokenRandomly = false;
    state.resultRevealed = false;
    state.screen = 'result';
  }
  render();
}

function applyOutcome(){
  const caught = state.accusedWasImpostor;
  const queue = [];
  const allowDiscovery = state.mode === 'impostor' && state.division !== 'perguntas';
  if(caught){
    const accused = state.players.find(p=>p.id===state.accusedId);
    accused.lives = Math.max(0, accused.lives - 1);
    if(allowDiscovery){
      state.impostorIds.filter(id=>id!==state.accusedId).forEach(id=>queue.push(id));
    }
  } else {
    activePlayers().forEach(p=>{
      if(!state.impostorIds.includes(p.id)) p.lives = Math.max(0, p.lives - 1);
    });
    if(allowDiscovery){
      state.impostorIds.forEach(id=>queue.push(id));
    }
  }
  state.discoveryQueue = queue;
  state.discoveryIndex = 0;
}

render();
</script>
</body>
</html>
